name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 语法检查
        run: python -m compileall -q app tools launcher.py run.py
      - name: 静态检查（未定义名 / 语法级错误）
        run: |
          python -m pip install --quiet ruff
          ruff check --select F821,F822,F823,F63,F7,E9 app tools launcher.py run.py

  smoke:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: ffmpeg 可用性
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            ffmpeg -version | Select-Object -First 1
          } else {
            Write-Host "系统无 ffmpeg，用 choco 安装"
            choco install ffmpeg -y --no-progress
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
            ffmpeg -version | Select-Object -First 1
          }

      - name: 安装依赖（不含 torch，走 --no-ai 路径）
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir numpy==1.23.5 opencv-python-headless==4.6.0.66 Pillow==9.3.0 scenedetect==0.7.2
          python -c "import cv2, scenedetect, numpy, PIL; print('cv2', cv2.__version__); print('scenedetect', scenedetect.__version__)"

      - name: 生成合成测试素材
        shell: pwsh
        run: python tools/make_fixtures.py --out tests/fixtures/synthetic

      - name: 冒烟检测（硬切素材）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          python run.py tests/fixtures/synthetic/hardcuts.mp4 -o out/ci --no-ai 2>&1 | Tee-Object -FilePath out/ci.log
          $code = $LASTEXITCODE
          Write-Host "---- 输出 ----"
          Get-Content out/ci.log
          if ($code -ne 0) { throw "检测进程退出码 $code" }
          $log = Get-Content out/ci.log -Raw
          if ($log -notmatch "镜头数") { throw "没有输出镜头统计" }
          Write-Host "冒烟检测通过"

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: |
            out/ci.log
            out/ci/
