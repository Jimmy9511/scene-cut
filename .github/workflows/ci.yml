name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 语法检查
        run: python -m compileall -q app tools launcher.py run.py
      - name: 单元测试（日志/设置）
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: 静态检查（未定义名 / 语法级错误）
        run: |
          python -m pip install --quiet ruff
          ruff check --select F821,F822,F823,F63,F7,E9,E402 app tools launcher.py run.py tests

  smoke:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: ffmpeg 可用性
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            ffmpeg -version | Select-Object -First 1
          } else {
            Write-Host "系统无 ffmpeg，用 choco 安装"
            choco install ffmpeg -y --no-progress
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
            ffmpeg -version | Select-Object -First 1
          }

      - name: 安装依赖（不含 torch，走 --no-ai 路径）
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir numpy==1.23.5 opencv-python-headless==4.6.0.66 Pillow==9.3.0 scenedetect==0.7.2
          python -c "import cv2, scenedetect, numpy, PIL; print('cv2', cv2.__version__); print('scenedetect', scenedetect.__version__)"

      - name: 生成合成测试素材
        shell: pwsh
        run: python tools/make_fixtures.py --out tests/fixtures/synthetic

      - name: 单元测试（含解码一致性，需 ffmpeg 与素材）
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: 冒烟检测（硬切素材）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          python run.py tests/fixtures/synthetic/hardcuts.mp4 -o out/ci --no-ai 2>&1 | Tee-Object -FilePath out/ci.log
          $code = $LASTEXITCODE
          Write-Host "---- 输出 ----"
          Get-Content out/ci.log
          if ($code -ne 0) { throw "检测进程退出码 $code" }
          $log = Get-Content out/ci.log -Raw
          if ($log -notmatch "镜头数") { throw "没有输出镜头统计" }
          Write-Host "冒烟检测通过"

      - name: 冒烟：日志与接口（--log-level debug）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $env:SCENECUT_DATA = Join-Path $PWD "out\ci-data"
          $proc = Start-Process -FilePath "python" -ArgumentList @(
            "-m","app.api.server","--port","8877","--log-level","debug",
            "--workspace", (Join-Path $env:SCENECUT_DATA "workspace"),
            "--pool", (Join-Path $env:SCENECUT_DATA "appdata\pool.json")
          ) -PassThru -RedirectStandardOutput (Join-Path $PWD "out\server.log") -RedirectStandardError (Join-Path $PWD "out\server.err")
          try {
            Start-Sleep -Seconds 6
            $level = (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8877/api/log/level").Content
            Write-Host "log level:", $level
            if ($level -notmatch '"level"') { throw "日志级别接口异常" }
            $jobs = (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8877/api/jobs").Content
            Write-Host "jobs:", $jobs
            if ($jobs -notmatch '"jobs"') { throw "/api/jobs 接口异常" }

            $settings = (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8877/api/settings").Content
            Write-Host "settings:", $settings
            foreach ($key in @('"data_root"','"workspace"','"ai_fast"','"t2_sample_limit"','"data_root_source"')) {
              if ($settings -notmatch $key) { throw "/api/settings 缺少字段 $key" }
            }

            # 切换工作区到临时目录，并校验非法路径被拒
            $wsDir = Join-Path $PWD "out\ws-switch"
            $body = @{ workspace = $wsDir } | ConvertTo-Json
            $changed = (Invoke-WebRequest -UseBasicParsing -Method Post -Uri "http://127.0.0.1:8877/api/settings" -Body $body -ContentType "application/json").Content
            Write-Host "workspace switch:", $changed
            if ($changed -notmatch 'ws-switch') { throw "工作区切换未生效" }

            $bad = @{ workspace = $env:SCENECUT_DATA } | ConvertTo-Json
            try {
              Invoke-WebRequest -UseBasicParsing -Method Post -Uri "http://127.0.0.1:8877/api/settings" -Body $bad -ContentType "application/json" | Out-Null
              throw "非法工作区（数据目录本身）本应被拒绝"
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 400) { throw "非法工作区应返回 400" }
            }
            Get-Content out\server.log | Select-Object -Last 12
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
          if ((Get-Content out\server.log -Raw) -notmatch "\[app\]") { throw "控制台日志没有输出" }

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: |
            out/ci.log
            out/ci/
